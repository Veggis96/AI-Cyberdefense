[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cyberdefense-agent"
version = "0.1.0"
description = "Lab-safe defensive security event analysis agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AI Cyberdefense Agent contributors" }
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage>=7.6",
  "ruff>=0.6",
]

[project.scripts]
cyberdefense-agent = "cyberdefense_agent.cli:main"

[tool.setuptools.packages.find]
include = ["cyberdefense_agent*"]

[tool.setuptools.package-data]
cyberdefense_agent = ["rule_packs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
