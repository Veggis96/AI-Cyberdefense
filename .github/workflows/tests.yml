name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: coverage run -m unittest discover -s tests -t .

      - name: Report coverage
        run: coverage report --show-missing

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-cyberdefense-agent:ci .

      - name: Smoke test Docker image
        run: docker run --rm ai-cyberdefense-agent:ci --events samples/events.jsonl --json

  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform/local-docker fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=terraform/local-docker init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform/local-docker validate
